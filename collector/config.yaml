# =========================================================
#  리노벨(Renovel) 트렌드 레이더 설정 — v2
#  마케팅 데이터 추출 정책 반영본
# =========================================================
# 변경 이력:
#  v2 (2026-09-01): (1) 사이트별 페이지 수 분리, (2) 상위 백분위 선정 방식,
#                   (3) 5개 분류 축으로 키워드 확장.
#  v2.1 (2026-10-13): 경쟁사 키워드에 Risu AI 표기 변형 추가(RisuAI/Risu AI/리수AI/리수에이아이).
#  v2.2 (2026-10-27): Reddit r/visualnovels 추가(RSS 기본, 승인된 OAuth 토큰 사용 시 점수·댓글 수집).
#  v2.3 (2026-10-27): Reddit 수집 기준을 최근 일주일 상위글 25건으로 변경.
#  v2.4 (2026-10-29): AI채팅 여성향 갤러리 추가, 기본 블록 화면 최상단 오른쪽 배치.
#  v2.5 (2026-10-29): AI채팅을 최상단 왼쪽으로, 바베챗을 두 번째 줄로 이동.
#  v2.6 (2026-10-29): 뤼튼 여성향 미니 갤러리 수집 및 두 번째 줄 왼쪽 배치.
#  v2.7 (2026-11-03): 뤼튼 여성향 다음에 동사무소·어둠의 뤼튼 여성향·AI 채팅 메아리 추가.
# ※ 이 파일을 바꿀 때마다 위 변경 이력에 한 줄 남겨두세요. 그래야 주간 비교가 됩니다.

# ---- 수집 범위 ------------------------------------------------
collect_days: 60            # 한 번 실행할 때 '새로 가져올' 글의 기간(일). 이보다 오래된 글은 이번 수집에서 무시.
                            #  (글 적은 갤러리의 과거 글까지 채우려면 이 값과 해당 갤러리 pages 를 함께 키우세요.)
store_retention_days: 180   # 누적 저장소에 글을 며칠간 보관할지. 매일 조금씩 쌓아 이 기간만큼 축적됩니다.
default_pages: 3            # source에 pages가 없으면 이 값을 사용 (1p ≈ 최신글 50개)
request_delay_seconds: 2.5  # 요청 간격(초). 낮추지 마세요(차단 위험).

sources:
  - name: "디시 AI채팅 갤러리"
    type: "dcinside"
    board_id: "aichatting"
    mode: "recommend"       # recommend=개념글 / all=전체글
    pages: 3

  - name: "디시 AI채팅 여성향 갤러리"
    type: "dcinside"
    board_id: "aiotomechatting"
    mode: "all"             # 최신 전체글 수집. sources 두 번째는 기본 2열 화면의 최상단 오른쪽.
    pages: 3

  - name: "디시 뤼튼 여성향 갤러리"
    type: "dcinside"
    board_id: "wrtnw"
    gallery_type: "mini"
    mode: "all"             # 최신 전체글. sources 세 번째는 기본 2열 화면의 두 번째 줄 왼쪽.
    pages: 3

  - name: "디시 동사무소 갤러리"
    type: "dcinside"
    board_id: "dongsamooso"
    gallery_type: "mini"
    mode: "all"
    pages: 3

  - name: "디시 어둠의 뤼튼 여성향 갤러리"
    type: "dcinside"
    board_id: "wrtndark"
    gallery_type: "mini"
    mode: "all"
    pages: 3

  - name: "디시 AI 채팅 메아리 갤러리"
    type: "dcinside"
    board_id: "aichatecho"
    gallery_type: "mini"
    mode: "all"
    pages: 3

  - name: "디시 바베챗 갤러리"
    type: "dcinside"
    board_id: "babechat"
    mode: "recommend"       # 다른 갤러리와 동일한 개념글 기준
    pages: 3

  - name: "디시 제타 갤러리"
    type: "dcinside"
    board_id: "zetam"
    mode: "recommend"
    pages: 3

  - name: "디시 크랙 갤러리"
    type: "dcinside"
    board_id: "cr1"
    mode: "all"             # 크랙 갤러리는 개념글이 적어 전체글로 수집 (조회/댓글순 정렬은 대시보드에서)
    pages: 3

  - name: "디시 탑툰챗 갤러리"
    type: "dcinside"
    board_id: "toptoonchat"
    mode: "all"             # 글이 많지 않아 전체글로 수집 (조회/댓글순 정렬은 대시보드에서)
    pages: 10               # 글 적은 갤러리라 초기 데이터를 빨리 채우려고 더 깊게

  - name: "아카라이브 AI채팅 채널"
    type: "arca"
    channel: "characterai"
    mode: "best"            # best=개념글 / all=전체글
    pages: 5                # 아카는 best 필터가 엄격해 표본이 얇음 → 더 깊게

  - name: "Reddit r/visualnovels"
    type: "reddit"
    subreddit: "visualnovels"
    mode: "top"
    time_filter: "week"
    pages: 1                # 최근 일주일 상위글 25건부터 누적. RSS는 점수·댓글·조회수 미제공.

# ---- 신호 선정 정책 (무엇을 '유의미'로 볼지) ------------------
# 고정 숫자가 아니라 '각 사이트 내 추천 상위 N%'로 잡습니다.
# 디시/아카를 절대 하나로 합쳐 순위 매기지 않습니다(스케일이 다름).
selection:
  recommend_top_percent: 20     # 각 사이트에서 추천 상위 20%
  min_recommend_floor: 3        # 조용한 날 방어용 바닥값(이 미만은 상위여도 제외)
  # 아래 축에 걸린 글은 순위가 낮아도 무조건 포함(전략적으로 중요한 축만).
  force_include_groups: ["brand", "competitors", "demand_pain"]

# ---- 분류 축 (인사이트의 뼈대) -------------------------------
# 모든 글을 아래 5개 축으로 태깅합니다. 대소문자는 구분하지 않습니다.
# ※ brand / competitors 키 이름은 대시보드 집계와 연결되니 그대로 두세요.
watch_keywords:
  # 1) 브랜드: 우리 서비스
  brand:
    ["리노벨", "Renovel", "renovel", "리노벨챗"]

  # 2) 경쟁사: 언급 순위와 맥락(호평/불만)
  #    정식명 + 안전한 약칭(2글자+). 한 글자 약칭은 오탐 때문에 '대괄호 말머리'([케] 등)로만 잡음.
  competitors:
    ["로판", "로판ai", "로판AI", "케이브덕", "케덕", "제타", "zeta",
     "모치스", "lumo", "루모", "팅글", "블룸", "엘린", "티팟", "티키타",
     "우마이", "바베챗", "바베", "플레이툰", "네코챗", "라이트노벨피아", "노벨피아",
     "리수", "risu", "RisuAI", "Risu AI", "리수AI", "리수에이아이",
     "character.ai", "캐릭터ai", "재뉴",
     "[케]", "[롶]", "[젵]", "[팊]", "[엘]", "[움]", "[플]", "[바베]"]

  # 3) 수요·불만: 제품/랜딩 카피에 직접 반영되는 가장 중요한 축
  demand_pain:
    ["검열", "무검열", "요금", "결제", "가격", "무료", "유료", "구독",
     "기억", "기억력", "맥락", "속도", "느림", "렉", "끊김", "퀄리티",
     "성능", "토큰", "한도", "제한", "환불"]

  # 4) 콘텐츠·밈: 바이럴된 포맷/소재
  content_meme:
    ["짤", "움짤", "gif", "후기", "스샷", "스크린샷", "로그", "썰", "레전드"]

  # 5) 용어·표현: 유저가 실제 쓰는 단어(카피/검색/ASO 소스). 태깅 전용.
  terms:
    ["봇", "프롬프트", "탈옥", "로어북", "상태창", "정규식", "프리셋",
     "페르소나", "api", "지피티", "gpt", "클로드", "claude", "제미나이",
     "gemini", "딥시크", "deepseek"]

  # 6) 특수 감시 키워드: 별도로 모아 보고 싶은 단어 (대시보드에 '감시어' 필터로 노출)
  #    ※ '꼴'은 한 글자라 '꼴값·꼴등·개꼴림' 등에도 걸립니다(오탐). 잡음 많으면 빼거나 [꼴]로 교체.
  watch:
    ["꼴잘알", "꼴"]

# ---- 밈/짤 후보 감지 (선정과 별개로 표시용) ------------------
meme_signal:
  max_title_len: 40
  min_recommend: 15

# ---- 경쟁사 약칭 → 정식명 묶음 (대시보드 '경쟁사' 필터/순위에서 통합 집계) ----
# 예: '케이브덕'·'케덕'·'[케]' 를 모두 '케이브덕' 하나로 묶어 셉니다.
# 여기 없는 경쟁사 단어는 그 단어 자체가 이름으로 표시됩니다.
competitor_canonical:
  "케이브덕":  ["케이브덕", "케덕", "[케]"]
  "로판":      ["로판", "로판ai", "로판AI", "[롶]"]
  "제타":      ["제타", "zeta", "[젵]"]
  "티팟":      ["티팟", "티키타", "[팊]"]
  "엘린":      ["엘린", "[엘]"]
  "우마이":    ["우마이", "[움]"]
  "플레이툰":  ["플레이툰", "[플]"]
  "바베챗":    ["바베챗", "바베", "[바베]"]
  "루모":      ["lumo", "루모"]
  "노벨피아":  ["라이트노벨피아", "노벨피아"]
  "리수":      ["리수", "risu", "RisuAI", "Risu AI", "리수AI", "리수에이아이"]
  "character.ai": ["character.ai", "캐릭터ai"]
  "모치스":    ["모치스"]
  "팅글":      ["팅글"]
  "블룸":      ["블룸"]
  "네코챗":    ["네코챗"]
  "재뉴":      ["재뉴"]

# ---- 키워드 빈도 분석 ---------------------------------------
# 기간 내 글에서 단어를 모아 횟수순으로 정렬합니다.
#  - 관심 키워드(위 watch_keywords): 정확하게 카운트
#  - 자동 추출 단어: 제목에서 단어를 뽑아 새 단어/밈까지 발견 (불용어·관심키워드 제외)
keyword_freq:
  min_word_len: 2     # 이 글자 수 미만 단어는 무시
  top_n: 40           # 자동 추출 단어 상위 몇 개까지
  # 자주 나오지만 의미 없는 단어(불용어). 결과에 잡음이 많으면 여기에 추가하세요.
  stopwords:
    ["그냥", "진짜", "이거", "근데", "오늘", "해줘", "이번", "완전", "이제", "너무",
     "질문", "일반", "우리", "그리고", "해서", "하는", "있는", "없는", "같은",
     "the", "and", "for", "with", "this", "that", "are", "was", "were", "have", "has",
     "you", "your", "what", "which", "how", "why", "can", "any", "not", "but", "from",
     "이런", "저런", "그런", "때문", "여기", "저기", "정도", "관련", "정리", "생각"]
